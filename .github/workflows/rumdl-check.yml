name: rumdl-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-inlined-logs:
    runs-on: windows-2022
    steps:
      - name: Project Checkout
        uses: actions/checkout@v6.0.0

      - name: Lint with rumdl
        uses: ubiratansoares/rumdl@ufs/rumdl-action
        with:
          report-type: workflow-logs

  lint-workflow-annotations:
    runs-on: macos-15
    steps:
      - name: Project Checkout
        uses: actions/checkout@v6.0.0

      - name: Lint with rumdl
        uses: ubiratansoares/rumdl@ufs/rumdl-action
        with:
          report-type: workflow-annotations

  lint-code-scanning:
    runs-on: macos-15
    steps:
      - name: Project Checkout
        uses: actions/checkout@v6.0.0

      - name: Lint with rumdl
        uses: ubiratansoares/rumdl@ufs/rumdl-action
        with:
          report-type: sarif-file

      - name: Upload results to Github Code Scanning
        if: failure()
        uses: github/codeql-action/upload-sarif@v3.31.2
        with:
          sarif_file: ${{ github.workspace}}/rumdl.sarif
